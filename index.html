<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Playwatch</title>
  <meta name="description" content="Suivi de séries et de films : épisodes vus, prochains épisodes, notifications.">
  <meta name="theme-color" content="#0d0d11">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Playwatch">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png?v=3">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=3">
  <link rel="preconnect" href="https://api.themoviedb.org">
  <link rel="preconnect" href="https://image.tmdb.org">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="view"><div class="boot"><div class="logo"><img src="icons/icon-192.png" alt=""><b>Playwatch</b></div></div></main>
  <nav id="tabs" class="hidden"></nav>
  <div id="sheets"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
  <script>
  // Filet de sécurité : si l'app n'a pas démarré au bout de 12 s (réseau très lent, fichier abîmé…),
  // on l'explique sous le logo, avec l'erreur éventuelle et un bouton pour relancer proprement.
  (function () {
    var err = "";
    addEventListener("error", function (e) { if (!err) err = e.message || (e.target && (e.target.src || e.target.href) ? "Fichier introuvable : " + (e.target.src || e.target.href) : ""); }, true);
    addEventListener("unhandledrejection", function (e) { if (!err) err = String(e.reason && e.reason.message || e.reason || ""); });
    setTimeout(function () {
      if (window.__pwUp) return;
      var b = document.querySelector(".boot"); if (!b || b.querySelector(".bootmsg")) return;
      var d = document.createElement("div"); d.className = "bootmsg";
      d.style.cssText = "position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 56px);display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 24px;text-align:center;color:#9a9aa6;font:14px/1.4 -apple-system,system-ui,sans-serif";
      d.innerHTML = '<div>Le démarrage prend plus de temps que prévu.</div><button type="button" style="font:600 15px -apple-system,system-ui,sans-serif;padding:11px 22px;border-radius:12px;border:0;background:#ffc83d;color:#111">Relancer</button><small style="font-size:11px;opacity:.75;word-break:break-word"></small>';
      d.querySelector("small").textContent = err ? err.slice(0, 300) : "";
      d.querySelector("button").onclick = function () {
        var go = function () { location.reload(); };
        try { caches.keys().then(function (ks) { return Promise.all(ks.filter(function (k) { return k !== "bobine-img"; }).map(function (k) { return caches.delete(k); })); }).then(go, go); } catch (e) { go(); }
      };
      b.appendChild(d);
    }, 12000);
  })();
  </script>
</body>
</html>
